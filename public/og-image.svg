<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid dots -->
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#262626"/>
    </pattern>
    <!-- Sky glow -->
    <radialGradient id="glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Left accent bar -->
  <rect x="80" y="180" width="3" height="270" rx="2" fill="#38bdf8" opacity="0.6"/>

  <!-- Status pill -->
  <rect x="100" y="180" width="280" height="28" rx="14" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <circle cx="120" cy="194" r="4" fill="#34d399"/>
  <text x="135" y="199" font-family="monospace" font-size="12" fill="#34d399" letter-spacing="1">Open to SRE · DevOps · Cloud</text>

  <!-- Name -->
  <text x="100" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#f5f5f5">Saumya Kumar</text>

  <!-- Title -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#38bdf8">Cloud &amp; DevOps Engineer</text>

  <!-- Tagline -->
  <text x="100" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#737373">Building reliable cloud infrastructure, automated deployments,</text>
  <text x="100" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#737373">and operationally sound systems.</text>

  <!-- Tech tags -->
  <!-- AWS -->
  <rect x="100" y="470" width="70" height="28" rx="4" fill="#171717" stroke="#404040" stroke-width="1"/>
  <text x="135" y="489" font-family="monospace" font-size="13" fill="#a3a3a3" text-anchor="middle">AWS</text>
  <!-- Terraform -->
  <rect x="182" y="470" width="96" height="28" rx="4" fill="#171717" stroke="#404040" stroke-width="1"/>
  <text x="230" y="489" font-family="monospace" font-size="13" fill="#a3a3a3" text-anchor="middle">Terraform</text>
  <!-- Docker -->
  <rect x="290" y="470" width="78" height="28" rx="4" fill="#171717" stroke="#404040" stroke-width="1"/>
  <text x="329" y="489" font-family="monospace" font-size="13" fill="#a3a3a3" text-anchor="middle">Docker</text>
  <!-- Kubernetes -->
  <rect x="380" y="470" width="108" height="28" rx="4" fill="#171717" stroke="#404040" stroke-width="1"/>
  <text x="434" y="489" font-family="monospace" font-size="13" fill="#a3a3a3" text-anchor="middle">Kubernetes</text>
  <!-- CI/CD -->
  <rect x="500" y="470" width="68" height="28" rx="4" fill="#171717" stroke="#404040" stroke-width="1"/>
  <text x="534" y="489" font-family="monospace" font-size="13" fill="#a3a3a3" text-anchor="middle">CI/CD</text>

  <!-- Right: mini CI/CD flow -->
  <g transform="translate(820, 160)">
    <rect width="300" height="310" rx="12" fill="#0f172a" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>
    <text x="150" y="30" font-family="monospace" font-size="11" fill="#475569" text-anchor="middle" letter-spacing="2">CI / CD FLOW</text>

    <!-- Flow nodes -->
    <rect x="40" y="50" width="220" height="34" rx="6" fill="#0c1a2e" stroke="#38bdf8" stroke-width="1"/>
    <text x="150" y="72" font-family="monospace" font-size="13" fill="#38bdf8" text-anchor="middle">Git Push</text>

    <line x1="150" y1="84" x2="150" y2="100" stroke="#374151" stroke-width="1"/>
    <polygon points="145,100 155,100 150,108" fill="#374151"/>

    <rect x="40" y="108" width="220" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="150" y="130" font-family="monospace" font-size="13" fill="#9ca3af" text-anchor="middle">GitHub Actions</text>

    <line x1="150" y1="142" x2="150" y2="158" stroke="#374151" stroke-width="1"/>
    <polygon points="145,158 155,158 150,166" fill="#374151"/>

    <rect x="40" y="166" width="220" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="150" y="188" font-family="monospace" font-size="13" fill="#9ca3af" text-anchor="middle">Terraform · Docker</text>

    <line x1="150" y1="200" x2="150" y2="216" stroke="#374151" stroke-width="1"/>
    <polygon points="145,216 155,216 150,224" fill="#374151"/>

    <rect x="40" y="224" width="220" height="34" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="150" y="246" font-family="monospace" font-size="13" fill="#9ca3af" text-anchor="middle">AWS EC2 · VPC</text>

    <line x1="150" y1="258" x2="150" y2="274" stroke="#374151" stroke-width="1"/>
    <polygon points="145,274 155,274 150,282" fill="#374151"/>

    <rect x="40" y="282" width="220" height="34" rx="4" fill="#0c1a0c" stroke="#22c55e" stroke-width="1"/>
    <text x="150" y="304" font-family="monospace" font-size="13" fill="#4ade80" text-anchor="middle">CloudWatch</text>
  </g>

  <!-- URL -->
  <text x="100" y="590" font-family="monospace" font-size="14" fill="#404040">saumyakumar.dev</text>
</svg>
